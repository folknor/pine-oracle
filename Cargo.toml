[workspace]
members = ["."]
resolver = "2"
dependencies = {}

[workspace.lints.rust]
future_incompatible = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unused = "deny"
variant_size_differences = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
match_same_arms = "deny"
redundant_else = "deny"
unnested_or_patterns = "deny"
map_unwrap_or = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
todo = "deny"

[package]
name = "pine-oracle"
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
description = "Pine v6 oracle CLI: lookup, validate, search Pine semantics"
license = "MPL-2.0"

[lints]
workspace = true

[[bin]]
name = "po"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
piners-runtime = { path = "../piners/crates/piners-runtime" }
piners-syntax = { path = "../piners/crates/piners-syntax" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
include_dir = { version = "0.7", features = ["glob"] }
owo-colors = "4"
pulldown-cmark = "0.13"
tantivy = "0.26"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
