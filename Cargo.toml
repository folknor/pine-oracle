[package]
name = "pine-cli"
version = "0.0.1"
edition = "2021"
description = "Pine v6 oracle CLI: lookup, validate, search Pine semantics"
license = "Apache-2.0 OR MPL-2.0"

[[bin]]
name = "pine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comrak = "0.29"
include_dir = { version = "0.7", features = ["glob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
